name: Weekly harvest

on:
  schedule:
    # Off-the-hour on purpose: GitHub queues scheduled events on shared
    # infrastructure, and jobs booked at :00 sit behind the heaviest
    # contention. On-the-hour runs were being delivered 5-6h late by Sep 2026.
    - cron: '17 6 * * 1'     # Mondays 06:17 UTC
  workflow_dispatch:           # manual trigger button in Actions tab

# Run only one at a time; cancel any older queued runs.
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # 6-hour ceiling minus margin
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ──────────────────────────────────────────────────────────────
      # Primary harvest: PubMed, Europe PMC, OpenAlex
      # Each script is resumable; safe to re-run on failure.
      # ──────────────────────────────────────────────────────────────
      - name: Harvest PubMed
        run: python scripts/harvest_pubmed.py
      - name: Harvest Europe PMC
        run: python scripts/harvest_europepmc.py
      - name: Harvest OpenAlex
        run: python scripts/harvest_openalex.py

      # ──────────────────────────────────────────────────────────────
      # Dedup and load into Supabase
      # ──────────────────────────────────────────────────────────────
      - name: Dedup and load
        run: python scripts/dedup_and_load.py

      # ──────────────────────────────────────────────────────────────
      # Enrichment (idempotent; skips already-enriched rows)
      # ──────────────────────────────────────────────────────────────
      - name: Enrich via Crossref
        run: python scripts/enrich_crossref.py
      - name: Enrich via Unpaywall
        run: python scripts/enrich_unpaywall.py

      # ──────────────────────────────────────────────────────────────
      # Quality passes — Postgres-native (read + write bibliography_records)
      # ──────────────────────────────────────────────────────────────
      - name: OpenAlex post-filter
        run: python scripts/filter_openalex_only.py
      - name: Topic tagging
        run: python scripts/tag_topics.py

      # ──────────────────────────────────────────────────────────────
      # Exports + browser asset (read Postgres; reflect filter/tag results)
      # ──────────────────────────────────────────────────────────────
      - name: Generate exports + coverage report
        run: python scripts/export_and_report.py
      - name: Rebuild browser asset
        run: python scripts/build_browser.py

      # The website's Evidence Library fetches bibliography_slim.json from R2.
      # This step was missing until 2026-09: every other export refreshed
      # weekly while the site's own data file sat frozen at its 2026-06-21
      # hand-built copy, so the public record count stopped tracking the
      # corpus. Reads public_bibliography (the relevance + tag/tier + year
      # gate), so it must run after the post-filter and tagging steps.
      - name: Rebuild website slim JSON
        run: python scripts/build_site_slim_json.py

      # ──────────────────────────────────────────────────────────────
      # Publish exports to Cloudflare R2
      # ──────────────────────────────────────────────────────────────
      - name: Configure AWS CLI for R2
        run: |
          aws configure set default.region auto
          aws configure set default.s3.signature_version s3v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

      - name: Upload exports to R2 (latest/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws --endpoint-url "$R2_ENDPOINT" \
              s3 cp exports/ s3://tnbc-atlas-exports/latest/ \
              --recursive \
              --content-encoding "" \
              --cache-control "public, max-age=86400"

      # ──────────────────────────────────────────────────────────────
      # Tell the website to rebuild, so its corpus figures pick up the
      # stats.json we just published. Without this the site would keep
      # rendering whatever numbers were current at its last deploy.
      #
      # Non-fatal on purpose: the data is already live on R2 at this point,
      # and a missing/expired token should not red an otherwise good harvest.
      # If SITE_REBUILD_TOKEN is unset the step is skipped with a notice.
      # ──────────────────────────────────────────────────────────────
      - name: Trigger website rebuild
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REBUILD_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::SITE_REBUILD_TOKEN not set — skipping website rebuild."
            echo "The corpus figures on tnbc.info will not update until the site is redeployed."
            exit 0
          fi
          gh api repos/lagunacellar/tnbc/dispatches \
            -f event_type=corpus-updated \
            -F "client_payload[run_id]=${GITHUB_RUN_ID}" \
            && echo "Dispatched corpus-updated to lagunacellar/tnbc"

      # ──────────────────────────────────────────────────────────────
      # Upload current coverage report as a workflow artifact
      # ──────────────────────────────────────────────────────────────
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            reports/coverage_report.md
            reports/topic_distribution.csv
            reports/top_journals.csv
            reports/top_cited.csv
            reports/openalex_postfilter.md
          retention-days: 90
